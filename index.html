<style>
/* Layout: mapa noturno ocupando o palco, painel de comando à direita (abaixo no celular). Cores dos jogadores pintam os territórios; o amarelo de faixa de trânsito marca seleção e ação. */
:root{
  --fundo:#0E1116; --painel:#161B22; --painel-2:#1F2630; --painel-3:#2A3340;
  --texto:#E8EDF2; --suave:#93A1B0; --linha:rgba(232,237,242,.12);
  --faixa:#FFD84D; --perigo:#FF5A5F; --ok:#4CD38A; --terra:#2A313B;
  --f-cartaz:"Saira Stencil One","Arial Black",Impact,sans-serif;
  --f-texto:"Saira","Helvetica Neue",Arial,sans-serif;
  --f-mapa:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--fundo);color:var(--texto)}
body{margin:0;font-family:var(--f-texto);font-size:15px;line-height:1.4}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--faixa);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:1500px;margin-inline:auto;padding-inline:16px;padding-block:12px 32px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.app.jogo{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.app.jogo .topo{grid-column:1/-1}}
.app.fone{max-width:560px}
.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-bottom:10px;border-bottom:1px solid var(--linha)}
.marca{font-family:var(--f-cartaz);font-weight:400;font-size:clamp(22px,3.4vw,34px);line-height:1;letter-spacing:.01em}
.marca span{color:var(--faixa)}
.topo-lado{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--linha);border-radius:999px;padding:4px 10px;color:var(--suave);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.chip.sala{color:var(--faixa);border-color:var(--faixa)}

.bloco{display:grid;gap:10px;min-width:0}
.rotulo{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.chamada{font-family:var(--f-cartaz);font-weight:400;font-size:clamp(22px,3vw,30px);line-height:1.1;text-wrap:balance}
.nota{font-size:13.5px;color:var(--suave);max-width:62ch}
.btn{background:var(--faixa);color:#15130A;border:0;border-radius:10px;font-weight:800;font-size:16px;padding:12px 18px;min-height:46px}
.btn.sec{background:transparent;color:var(--texto);border:1.5px solid var(--linha)}
.btn.mini{font-size:13px;padding:6px 10px;min-height:34px;border-radius:8px}
.btn.perigo{background:var(--perigo);color:#1a0505}
.btn:disabled{opacity:.38;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;border:1.5px solid var(--linha);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--texto);color:var(--fundo);border-color:var(--texto)}
input[type=text]{background:var(--painel-2);border:1.5px solid var(--linha);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}

/* Configuração */
.config{display:grid;gap:22px;max-width:980px}
.linhas-jog{display:grid;gap:8px}
.linhas-jog li{display:flex;gap:8px;align-items:center}
.cor-btn{width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.25);flex:none}
.duas{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--painel);border-radius:14px;padding:14px}
.qr{background:#fff;padding:8px;border-radius:10px;width:max-content}
.qr img,.qr canvas{display:block;width:150px;height:150px}
.codigo{font-family:var(--f-cartaz);font-size:40px;line-height:1;color:var(--faixa);letter-spacing:.08em}
.endereco{font-size:12.5px;color:var(--suave);overflow-wrap:anywhere}

/* Mapa */
.palco{display:grid;gap:12px;min-width:0}
.mapa-caixa{position:relative;background:#0A0D11;border-radius:16px;overflow:hidden;border:1px solid var(--linha)}
.mapa{display:block;width:100%;height:auto;touch-action:manipulation}
.terr path{fill:var(--terra);stroke:#0A0D11;stroke-width:1.2;transition:fill-opacity .2s}
.terr{cursor:default}
.terr.cand{cursor:pointer}
.terr.cand path{stroke:var(--faixa);stroke-width:2;stroke-dasharray:5 4}
.terr.sel path{stroke:var(--faixa);stroke-width:4;stroke-dasharray:none}
.terr.alvo path{stroke:var(--perigo);stroke-width:4;stroke-dasharray:none}
.terr.apaga path{fill-opacity:.28}
@keyframes formiga{to{stroke-dashoffset:-18}}
.cont{fill:none;stroke:rgba(232,237,242,.55);stroke-width:2.4;pointer-events:none;stroke-linejoin:round}
.guia{stroke:rgba(232,237,242,.7);stroke-width:.9;pointer-events:none}
.guia-pt{fill:rgba(232,237,242,.85);pointer-events:none}
.selo circle.fundo{fill:#0E1116;stroke-width:3.2}
.selo circle.toque{fill:transparent}
.selo text.n{font-family:var(--f-mapa);font-weight:700;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.selo text.nome{font-family:var(--f-mapa);font-weight:600;font-size:10px;fill:#E8EDF2;text-anchor:middle;stroke:#0A0D11;stroke-width:2.6px;paint-order:stroke;pointer-events:none}
.terr.sel .selo circle.fundo{stroke:var(--faixa)!important}
.terr.ganhou .selo circle.fundo{animation:pulso .8s ease-out}
@keyframes pulso{0%{r:18}100%{r:12}}
@media (prefers-reduced-motion:reduce){.terr.cand path{animation:none}.terr.ganhou .selo circle.fundo{animation:none}}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--suave);padding:8px 12px}
.legenda b{color:var(--texto)}

/* Dados */
.batalha{background:var(--painel);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.mesa{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dados{display:flex;gap:6px}
.dado{width:38px;height:38px;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.dado.atk{background:#E5484D}.dado.def{background:#F2EEE3}
.dado i{width:7px;height:7px;border-radius:50%;place-self:center;visibility:hidden}
.dado.atk i{background:#fff}.dado.def i{background:#1b1b1b}
.dado i.on{visibility:visible}
.dado.perdeu{opacity:.35}
.dado.rola{animation:rola .35s ease-out}
@keyframes rola{0%{transform:rotate(-30deg) scale(.6)}100%{transform:none}}
.placar-batalha{font-size:14px}
.placar-batalha b{font-weight:800}

/* Painel */
.painel{display:grid;gap:14px;min-width:0}
@media (min-width:1000px){.painel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto;padding-right:2px}}
.cartao{background:var(--painel);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.vez{display:flex;align-items:center;gap:10px}
.bolinha{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.3)}
.vez strong{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.etapas{display:flex;gap:4px}
.etapas span{flex:1;text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 4px;border-radius:6px;background:var(--painel-2);color:var(--suave)}
.etapas span.ativa{background:var(--faixa);color:#15130A}
.grande{font-family:var(--f-cartaz);font-size:44px;line-height:1;color:var(--faixa)}
.lista-t{display:flex;flex-wrap:wrap;gap:6px}
.lista-t button{background:var(--painel-2);border:1.5px solid transparent;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;min-height:34px}
.lista-t button[aria-pressed="true"]{border-color:var(--faixa)}
.lista-t button small{color:var(--suave);font-weight:600;margin-left:4px}
.cartas{display:flex;flex-wrap:wrap;gap:6px}
.carta{background:var(--painel-2);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.simb{font-size:15px;line-height:1}
.jogadores{display:grid}
.jog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--linha)}
.jog .nome{font-weight:800;overflow-wrap:anywhere}
.jog .info{grid-column:2/-1;font-size:12.5px;color:var(--suave)}
.jog.morto{opacity:.4}
.jog.atual .nome{color:var(--faixa)}
.diario{display:grid;gap:4px;font-size:13px;color:var(--suave)}
.diario li:first-child{color:var(--texto)}
.cont-lista{display:grid;gap:4px;font-size:13px}
.cont-lista li{display:flex;justify-content:space-between;gap:8px}

/* Sobreposições */
.veu{position:fixed;inset:0;background:rgba(5,7,10,.82);display:grid;place-items:center;padding:16px;z-index:10}
.janela{background:var(--painel);border-radius:18px;padding:22px;max-width:560px;width:100%;display:grid;gap:14px;border:1px solid var(--linha)}
.objetivo{font-family:var(--f-cartaz);font-weight:400;font-size:clamp(22px,4vw,30px);line-height:1.15;color:var(--faixa);text-wrap:balance}
.vitoria .chamada{font-size:clamp(28px,5vw,44px)}

/* Celular */
.fone .cartao{gap:12px}
.escolher{display:grid;gap:8px}
.escolher button{display:flex;gap:10px;align-items:center;background:var(--painel-2);border:1.5px solid var(--linha);border-radius:12px;padding:14px;font-weight:800;font-size:17px;text-align:left}
</style>
</head>

  const pegar=(db,p)=>p.split("/").reduce((o,k)=>o&&o[k]!==undefined?o[k]:null,db);
  const por=(db,p,v)=>{const ks=p.split("/");let o=db;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=clone(v);};
  const avisar=()=>{const db=ler();ouv.slice().forEach(l=>l.cb(clone(pegar(db,l.p))));};
  const gravar=db=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}avisar();if(bc)bc.postMessage(1);};
  if(bc)bc.onmessage=avisar; window.addEventListener("storage",e=>{if(e.key===KEY)avisar();});
  return {tipo:"local",conectado:true,
    ouvir(p,cb){const l={p,cb};ouv.push(l);setTimeout(()=>cb(clone(pegar(ler(),p))),0);return()=>{const i=ouv.indexOf(l);if(i>=0)ouv.splice(i,1);};},
    set(p,v){const db=ler();por(db,p,v);gravar(db);},update(p,o){const db=ler();for(const k in o)por(db,p+"/"+k,o[k]);gravar(db);},remove(p){const db=ler();por(db,p,null);gravar(db);}};
}
let rede; try{rede=temFirebase?redeFirebase():redeLocal();}catch(e){rede=redeLocal();}

const params=new URLSearchParams(location.search);
const SALA_FONE=(params.get("sala")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
const EH_FONE=SALA_FONE.length===4;

/* =====================================================================
   JOGO (TV)
   ===================================================================== */
const CHAVE="treta-metropolitana-v1";
let g=null, cfg=null, remoto={}, desligar=null, veuAberto=null, animDados=false, ultimoGanho=null;

function cfgNova(){
  return {sala:novoCodigo(),modo:"objetivos",jogadores:[
    {nome:"Harvey",cor:"vermelho"},{nome:"Bia",cor:"azul"},{nome:"Caio",cor:"verde"},{nome:"Duda",cor:"amarelo"},{nome:"Edu",cor:"rosa"}],exemplo:true};
}
function salvar(){guardar(CHAVE,{g,cfg});publicar();}

const terrDe=i=>IDS.filter(t=>g.dono[t]===i);
const exDe=i=>terrDe(i).reduce((s,t)=>s+g.ex[t],0);
const contsDe=i=>Object.keys(CONT).filter(c=>IDS.filter(t=>T[t].c===c).every(t=>g.dono[t]===i));
const atual=()=>g.jogadores[g.vez];
const vizInimigos=t=>T[t].a.filter(v=>g.dono[v]!==g.dono[t]);
const vizMeus=t=>T[t].a.filter(v=>g.dono[v]===g.dono[t]);
const livre=t=>g.ex[t]-1-(g.chegou[t]||0);
function log(txt){g.log.unshift(txt);g.log=g.log.slice(0,8);}

function calcReforco(i){
  const base=Math.max(3,Math.floor(terrDe(i).length/2));
  return base+contsDe(i).reduce((s,c)=>s+CONT[c].b,0);
}
function bonusTroca(n){return n<BONUS_TROCA.length?BONUS_TROCA[n]:15+5*(n-BONUS_TROCA.length+1);}

function sortearObjetivos(){
  const n=g.jogadores.length;
  const pool=OBJETIVOS.map((o,i)=>({tipo:"o",i})).concat(g.jogadores.map((j,i)=>({tipo:"d",i})));
  embaralha(pool);
  g.jogadores.forEach((j,i)=>{
    const k=pool.findIndex(o=>!(o.tipo==="d"&&o.i===i));
    j.obj=pool.splice(k,1)[0];
  });
}
function objTexto(i){
  const j=g.jogadores[i];
  if(g.modo==="total") return "Conquistar todos os 34 territórios";
  const o=j.obj; if(!o) return "";
  if(o.tipo==="d"){
    const alvo=g.jogadores[o.i];
    if(!alvo.vivo&&alvo.elimPor!==i) return "Destruir os exércitos "+cor(alvo.cor).n+". Como outro jogador eliminou esse exército, seu objetivo virou: conquistar 18 territórios.";
    return "Destruir os exércitos "+cor(alvo.cor).n+" ("+alvo.nome+")";
  }
  return OBJETIVOS[o.i].t;
}
function cumpriu(i){
  const meus=terrDe(i);
  if(g.modo==="total") return meus.length===IDS.length;
  const o=g.jogadores[i].obj;
  if(o.tipo==="d"){
    const alvo=g.jogadores[o.i];
    if(!alvo.vivo) return alvo.elimPor===i||meus.length>=18;
    return false;
  }
  const ob=OBJETIVOS[o.i];
  if(ob.n) return meus.filter(t=>g.ex[t]>=(ob.min||1)).length>=ob.n;
  const tem=contsDe(i);
  if(!ob.k.every(c=>tem.indexOf(c)>=0)) return false;
  if(ob.mais) return tem.filter(c=>ob.k.indexOf(c)<0).length>=ob.mais;
  return true;
}
function verificar(){
  if(g.fase!=="jogo") return;
  if(cumpriu(g.vez)){ g.fase="fim"; g.vencedor=g.vez; log(atual().nome+" cumpriu o objetivo e venceu!"); }
}

function novaPartida(){
  const js=cfg.jogadores;
  g={v:1,fase:"jogo",modo:cfg.modo,sala:cfg.sala,
    jogadores:js.map(j=>({nome:j.nome||"Sem nome",cor:j.cor,vivo:true,cartas:[],obj:null,elimPor:null})),
    dono:{},ex:{},vez:0,inicio:0,etapa:"reforco",reforco:0,colocados:[],conquistou:false,trocas:0,
    baralho:[],descarte:[],sel:null,alvo:null,dados:null,pend:null,chegou:{},log:[],rodada:1,vencedor:null,auto:false};
  embaralha(IDS.slice()).forEach((t,k)=>{g.dono[t]=k%js.length;g.ex[t]=1;});
  g.vez=g.inicio=sorte(js.length);
  const simb=["tri","qua","cir"];
  g.baralho=embaralha(IDS.map((t,k)=>({t,s:simb[k%3]})).concat([{t:null,s:"cor"},{t:null,s:"cor"}]));
  sortearObjetivos();
  log("Partida começou. "+atual().nome+" abre a primeira rodada.");
  iniciarVez();
}
function iniciarVez(){
  const j=atual();
  g.etapa="reforco"; g.sel=g.alvo=null; g.pend=null; g.conquistou=false; g.colocados=[]; g.chegou={}; g.dados=null;
  g.reforco=calcReforco(g.vez);
  if(j.cartas.length>=5){ const b=trocar(true); if(b) log(j.nome+" tinha 5 cartas e trocou à força (+"+b+")."); }
}
function melhorTroca(cartas){
  let melhor=null;
  for(let a=0;a<cartas.length;a++)for(let b=a+1;b<cartas.length;b++)for(let c=b+1;c<cartas.length;c++){
    const tr=[cartas[a],cartas[b],cartas[c]], s=tr.filter(x=>x.s!=="cor").map(x=>x.s);
    const ok=s.length<=1||s.every(x=>x===s[0])||new Set(s).size===s.length;
    if(!ok) continue;
    const valor=tr.filter(x=>x.t&&g.dono[x.t]===g.vez).length*10-tr.filter(x=>x.s==="cor").length;
    if(!melhor||valor>melhor.v) melhor={v:valor,idx:[a,b,c]};
  }
  return melhor;
}
function trocar(forcado){
  const j=atual(), m=melhorTroca(j.cartas); if(!m) return 0;
  const tr=m.idx.map(k=>j.cartas[k]);
  j.cartas=j.cartas.filter((x,k)=>m.idx.indexOf(k)<0);
  g.descarte.push(...tr);
  const b=bonusTroca(g.trocas); g.trocas++; g.reforco+=b;
  const extra=tr.filter(x=>x.t&&g.dono[x.t]===g.vez).map(x=>x.t);
  extra.forEach(t=>{g.ex[t]+=2;});
  if(!forcado) log(j.nome+" trocou cartas: +"+b+" exércitos"+(extra.length?" e +2 em "+lista(extra.map(t=>T[t].n)):"")+".");
  return b;
}
function proximoVivo(i){const n=g.jogadores.length;for(let k=1;k<=n;k++){const x=(i+k)%n;if(g.jogadores[x].vivo)return x;}return i;}
function fimVez(){
  const j=atual();
  if(g.conquistou){
    if(!g.baralho.length){g.baralho=embaralha(g.descarte);g.descarte=[];}
    const c=g.baralho.pop(); if(c){j.cartas.push(c);}
  }
  const n=g.jogadores.length, pos=i=>(i-g.inicio+n)%n, ant=g.vez;
  g.vez=proximoVivo(g.vez);
  if(pos(g.vez)<=pos(ant)) g.rodada++;
  iniciarVez();
}

/* ações de mapa */
function candidatos(){
  const c=new Set(), i=g.vez;
  if(g.fase!=="jogo"||g.pend) return c;
  if(g.etapa==="reforco"){ if(g.reforco>0) terrDe(i).forEach(t=>c.add(t)); return c; }
  if(g.etapa==="ataque"){
    terrDe(i).filter(t=>g.ex[t]>=2&&vizInimigos(t).length).forEach(t=>c.add(t));
    if(g.sel) vizInimigos(g.sel).forEach(t=>c.add(t));
    return c;
  }
  if(g.etapa==="mover"){
    terrDe(i).filter(t=>livre(t)>0&&vizMeus(t).length).forEach(t=>c.add(t));
    if(g.sel) vizMeus(g.sel).forEach(t=>c.add(t));
    return c;
  }
  return c;
}
function tocar(t){
  if(g.fase!=="jogo"||g.pend) return;
  const meu=g.dono[t]===g.vez;
  if(g.etapa==="reforco"){
    if(meu&&g.reforco>0){g.ex[t]++;g.reforco--;g.colocados.push(t);g.sel=t;}
  }else if(g.etapa==="ataque"){
    if(meu){ if(g.sel===t){g.sel=null;g.alvo=null;} else if(g.ex[t]>=2&&vizInimigos(t).length){g.sel=t;g.alvo=null;} }
    else if(g.sel&&T[g.sel].a.indexOf(t)>=0){ g.alvo=t; }
  }else if(g.etapa==="mover"){
    if(g.sel&&meu&&t!==g.sel&&T[g.sel].a.indexOf(t)>=0){ moverUm(g.sel,t); }
    else if(meu){ if(g.sel===t){g.sel=null;g.alvo=null;} else if(livre(t)>0&&vizMeus(t).length){g.sel=t;g.alvo=null;} }
  }
  g.dados=g.etapa==="ataque"?g.dados:null;
  verificar(); salvar(); desenhar();
}
function moverUm(de,para){ if(livre(de)<=0) return; g.ex[de]--; g.ex[para]++; g.chegou[para]=(g.chegou[para]||0)+1; g.alvo=para; }

function rolarUma(de,para){
  const na=Math.min(3,g.ex[de]-1), nd=Math.min(3,g.ex[para]);
  const a=Array.from({length:na},()=>1+sorte(6)).sort((x,y)=>y-x);
  const d=Array.from({length:nd},()=>1+sorte(6)).sort((x,y)=>y-x);
  let pa=0,pd=0; const res=[];
  for(let k=0;k<Math.min(na,nd);k++){ if(a[k]>d[k]){pd++;res.push("a");} else {pa++;res.push("d");} }
  g.ex[de]-=pa; g.ex[para]-=pd;
  return {a,d,pa,pd,res};
}
function atacar(ateFim){
  const de=g.sel, para=g.alvo; if(!de||!para||g.pend) return;
  if(g.dono[de]!==g.vez||g.dono[para]===g.vez||g.ex[de]<2) return;
  const defensor=g.dono[para]; let tpa=0,tpd=0,ult=null,rol=0;
  do{ ult=rolarUma(de,para); tpa+=ult.pa; tpd+=ult.pd; rol++; } while(ateFim&&g.ex[para]>0&&g.ex[de]>1);
  g.dados={a:ult.a,d:ult.d,res:ult.res,pa:tpa,pd:tpd,rol,de,para,nome:[T[de].n,T[para].n],cores:[atual().cor,g.jogadores[defensor].cor]};
  animDados=true;
  if(g.ex[para]===0){
    const def=g.jogadores[defensor];
    g.dono[para]=g.vez; g.conquistou=true; ultimoGanho=para;
    const max=Math.min(3,g.ex[de]-1);
    g.pend={de,para,max};
    log(atual().nome+" conquistou "+T[para].n+" de "+def.nome+".");
    if(!terrDe(defensor).length){
      def.vivo=false; def.elimPor=g.vez; atual().cartas.push(...def.cartas); def.cartas=[];
      log(def.nome+" foi eliminado por "+atual().nome+"!");
    }
    if(max===1) ocupar(1,true);
  }else if(g.ex[de]<2){ g.sel=null; g.alvo=null; }
  verificar(); salvar(); desenhar();
}
function ocupar(n,silencioso){
  const p=g.pend; if(!p) return;
  n=Math.max(1,Math.min(p.max,n));
  g.ex[p.de]-=n; g.ex[p.para]=n; g.pend=null;
  g.sel=g.ex[p.para]>=2&&vizInimigos(p.para).length?p.para:(g.ex[p.de]>=2&&vizInimigos(p.de).length?p.de:null);
  g.alvo=null;
  if(!silencioso){verificar(); salvar(); desenhar();}
}
function avancar(){
  if(g.fase!=="jogo"||g.pend) return;
  if(g.etapa==="reforco"){
    if(g.reforco>0) return;
    if(g.rodada===1){ fimVez(); }
    else { g.etapa="ataque"; g.sel=null; g.alvo=null; }
  }else if(g.etapa==="ataque"){ g.etapa="mover"; g.sel=null; g.alvo=null; g.dados=null; }
  else { fimVez(); }
  verificar(); salvar(); desenhar();
}

let svgPronto=false;
function montarMapa(){
  const caixa=$("#mapa"); if(!caixa) return;
  let s='<svg class="mapa" viewBox="-8 -8 '+(MAPA.w+16)+' '+(MAPA.h+16)+'" role="img" aria-label="Mapa da Grande São Paulo">';

function pintarMapa(){
  const svg=document.querySelector("#mapa svg"); if(!svg) return;
  const cand=candidatos(), selecionando=g.etapa!=="reforco"&&!!g.sel&&!g.pend;
  MAPA.t.forEach(t=>{
    const el=svg.querySelector('.terr[data-t="'+t.id+'"]'), selo=svg.querySelector('.terr-selo[data-t="'+t.id+'"]');
    const d=g.dono[t.id], c=d!=null?cor(g.jogadores[d].cor).h:"#2A313B";
    const p=el.firstChild; p.style.fill=c; p.style.fillOpacity=".72";
    const cls=["terr"];
    if(cand.has(t.id)) cls.push("cand");
    if(g.sel===t.id) cls.push("sel");
    if(g.alvo===t.id) cls.push(g.etapa==="ataque"?"alvo":"sel");
    if(selecionando&&!cand.has(t.id)&&g.sel!==t.id&&g.alvo!==t.id) cls.push("apaga");
    el.setAttribute("class",cls.join(" "));
    selo.setAttribute("class","terr-selo terr"+(cand.has(t.id)?" cand":"")+(g.sel===t.id?" sel":"")+(ultimoGanho===t.id?" ganhou":""));
    const f=selo.querySelector("circle.fundo"); f.style.stroke=c;
    selo.querySelector("text.n").textContent=g.ex[t.id];
  });
  ultimoGanho=null;
}
function dadoHTML(v,tipo,perdeu){

      (g.sel&&g.reforco?'<div class="acoes"><button class="btn sec mini" data-a="tudo-aqui">Colocar todos em '+esc(T[g.sel].n)+'</button></div>':'')+

  return '<div class="cartao"><p class="rotulo">Remanejar</p>'+corpo+'<div class="acoes"><button class="btn" data-a="avancar">Terminar a vez</button></div></div>';

function painelJogo(){
  const j=atual(), c=cor(j.cor);
  const etapas=g.rodada===1?["Reforço"]:["Reforço","Ataque","Remanejar"], idx={reforco:0,ataque:1,mover:2}[g.etapa];
  let h='<div class="cartao"><div class="vez"><span class="bolinha" style="background:'+c.h+'"></span><strong>'+esc(j.nome)+'</strong></div>'+
    '<div class="etapas">'+etapas.map((e,k)=>'<span class="'+(k===idx?"ativa":"")+'">'+e+'</span>').join("")+'</div></div>';
  h+=painelAcao();
  h+='<div class="cartao"><p class="rotulo">Jogadores</p><ul class="jogadores">'+g.jogadores.map((p,k)=>{
    const vinc=remoto.vinculos&&remoto.vinculos[k];
    return '<li class="jog'+(p.vivo?"":" morto")+(k===g.vez?" atual":"")+'"><span class="bolinha" style="background:'+cor(p.cor).h+'"></span><span class="nome">'+esc(p.nome)+'</span>'+
      (g.modo==="objetivos"&&p.vivo?'<button class="btn sec mini" data-a="ver-obj" data-i="'+k+'">Objetivo</button>':'<span></span>')+
      '<span class="info">'+(p.vivo?pl(terrDe(k).length,"território","territórios")+" · "+pl(exDe(k),"exército","exércitos")+" · "+pl(p.cartas.length,"carta","cartas")+(g.modo==="objetivos"?(vinc?" · celular ligado":" · sem celular"):""):"Eliminado")+'</span></li>';
  }).join("")+'</ul></div>';
  h+='<div class="cartao"><p class="rotulo">Continentes</p><ul class="cont-lista">'+Object.keys(CONT).map(k=>{
    const dono=g.jogadores.findIndex((p,i)=>contsDe(i).indexOf(k)>=0);
    return '<li><span>'+CONT[k].n+' <span class="nota">+'+CONT[k].b+'</span></span><span>'+(dono>=0?'<span class="bolinha" style="display:inline-block;vertical-align:middle;width:11px;height:11px;background:'+cor(g.jogadores[dono].cor).h+'"></span> '+esc(g.jogadores[dono].nome):'<span class="nota">dividido</span>')+'</span></li>';
  }).join("")+'</ul></div>';
  h+='<div class="cartao"><p class="rotulo">Últimos lances</p><ul class="diario">'+g.log.map(l=>'<li>'+esc(l)+'</li>').join("")+'</ul></div>';
  h+='<div class="acoes"><button class="btn sec mini" data-a="celulares">Celulares e objetivos</button><button class="btn sec mini" data-a="sair">Encerrar partida</button></div>';
  return h;
}

/* ---------------- telas ---------------- */
function urlFone(){return location.origin+location.pathname+"?sala="+(g?g.sala:cfg.sala);}
function qrHTML(){
  return '<div class="qrbox"><div class="qr" id="qr"></div><div class="bloco"><span class="rotulo">Objetivos secretos no celular</span><span class="codigo">'+(g?g.sala:cfg.sala)+'</span><span class="endereco">'+esc(urlFone())+'</span>'+
    '<p class="nota">'+(rede.tipo==="local"?"Firebase não configurado: modo de teste. Use o botão Objetivo de cada jogador.":"Cada um lê o QR Code, escolhe o próprio nome e vê o objetivo só no celular.")+'</p></div></div>';
}
function telaConfig(){
  const js=cfg.jogadores, pode=js.length>=3&&js.length<=6;
  const salvo=abrir(CHAVE);
  return '<header class="topo"><h1 class="marca">Treta <span>Metropolitana</span></h1><div class="topo-lado"><span class="chip">Grande SP · 34 territórios</span></div></header>'+
  '<main class="config">'+
  (g&&g.fase==="jogo"?'<section class="cartao"><p class="rotulo">Partida em andamento</p><p>Rodada '+g.rodada+', vez de '+esc(atual().nome)+'.</p><div class="acoes"><button class="btn" data-a="continuar">Continuar a partida</button></div></section>':'')+
  '<section class="bloco"><p class="rotulo">Generais (3 a 6)</p>'+(cfg.exemplo?'<p class="nota">Nomes de exemplo. Troque pelos da turma. Toque na cor para trocar.</p>':'')+
    '<ul class="linhas-jog">'+js.map((p,k)=>'<li><button class="cor-btn" data-a="cor" data-k="'+k+'" style="background:'+cor(p.cor).h+'" aria-label="Cor de '+esc(p.nome)+': '+cor(p.cor).n+'"></button><input type="text" id="nome-'+k+'" data-nome="'+k+'" value="'+esc(p.nome)+'" maxlength="16" aria-label="Nome do jogador '+(k+1)+'" autocomplete="off"><button class="btn sec mini" data-a="tirar" data-k="'+k+'"'+(js.length<=3?" disabled":"")+'>Tirar</button></li>').join("")+'</ul>'+
    (js.length<6?'<div class="acoes"><button class="btn sec" data-a="mais">Adicionar general</button></div>':'')+
  '</section>'+
  '<section class="duas">'+
    '<div class="bloco"><p class="rotulo">Como se vence</p><div class="seg"><button data-a="modo" data-v="objetivos" aria-pressed="'+(cfg.modo==="objetivos")+'">Objetivo secreto</button><button data-a="modo" data-v="total" aria-pressed="'+(cfg.modo==="total")+'">Conquista total</button></div>'+
      '<p class="nota">'+(cfg.modo==="objetivos"?"Cada um recebe uma missão secreta: dominar regiões, juntar territórios ou destruir um rival. Partidas de 40 a 60 minutos.":"Vence quem dominar os 34 territórios. Bem mais longo.")+'</p></div>'+
    '<div class="bloco"><p class="rotulo">Mapa</p><div class="seg"><button aria-pressed="true">Grande SP</button><button disabled>Linhas de trem e metrô (em breve)</button></div>'+
      '<p class="nota">Alto Tietê, Capital, ABC, Norte, Oeste e Sudoeste. Dominar uma região inteira rende exércitos extras a cada rodada.</p></div>'+
  '</section>'+
  (cfg.modo==="objetivos"?'<section class="bloco">'+qrHTML()+'</section>':'')+
  '<section class="acoes"><button class="btn" data-a="comecar"'+(pode?"":" disabled")+'>'+(g&&g.fase==="jogo"?"Começar outra partida":"Começar a treta")+'</button>'+
    (g&&g.fase==="jogo"?'<span class="nota">A partida atual será descartada.</span>':'')+'</section>'+
  '<section class="cartao"><p class="rotulo">Regras rápidas</p><ul class="diario" style="color:var(--texto)">'+
    '<li>Na sua vez: reforce, ataque e remaneje. Na primeira rodada só se reforça.</li>'+
    '<li>Reforço: metade dos seus territórios (mínimo 3), mais o bônus das regiões que você domina inteiras.</li>'+
    '<li>Ataque: até 3 dados contra até 3. Compara-se o maior com o maior; empate é da defesa.</li>'+
    '<li>Conquistou ao menos um território na vez? Ganha uma carta. Três iguais ou três diferentes viram exércitos.</li>'+
    '<li>Com 5 cartas, a troca é obrigatória.</li></ul></section>'+
  '</main>';
}
function topoJogo(){
  return (g.modo==="objetivos"?'<span class="chip sala">Sala '+g.sala+'</span>'+(rede.tipo==="local"?'<span class="chip">Modo de teste</span>':(rede.conectado?'<span class="chip ok">Celulares conectados</span>':'<span class="chip">Sem conexão</span>')):'')+
    '<span class="chip">Rodada '+g.rodada+'</span>';
}
function telaJogo(){
  return '<header class="topo"><h1 class="marca">Treta <span>Metropolitana</span></h1><div class="topo-lado">'+topoJogo()+'</div></header>'+
    '<main class="palco"><div class="mapa-caixa"><div id="mapa"></div></div><div id="batalha">'+batalhaHTML()+'</div>'+
    '<div class="legenda">'+Object.keys(CONT).map(k=>'<span><b>'+CONT[k].n+'</b> +'+CONT[k].b+'</span>').join("")+'<span>Linhas brancas grossas separam as regiões.</span></div></main>'+
    '<aside class="painel" id="painel">'+painelJogo()+'</aside>';
}
function veuHTML(){
  if(!veuAberto) return "";
  if(veuAberto.tipo==="obj"){
    const k=veuAberto.i,p=g.jogadores[k];
    if(!veuAberto.ver) return '<div class="janela" role="dialog" aria-label="Objetivo"><p class="rotulo">Objetivo de '+esc(p.nome)+'</p><p>Se esta tela estiver espelhada na TV, todo mundo vai ver. Peça para os outros olharem para o lado.</p><div class="acoes"><button class="btn" data-a="obj-mostra">Mostrar</button><button class="btn sec" data-a="fechar">Cancelar</button></div></div>';
    return '<div class="janela" role="dialog" aria-label="Objetivo"><p class="rotulo">Objetivo de '+esc(p.nome)+'</p><p class="objetivo">'+esc(objTexto(k))+'</p><div class="acoes"><button class="btn" data-a="fechar">Esconder</button></div></div>';
  }
  if(veuAberto.tipo==="celulares") return '<div class="janela" role="dialog" aria-label="Celulares">'+qrHTML()+'<p class="nota">Quem ainda não ligou o celular pode ler agora. O objetivo aparece assim que escolher o próprio nome.</p><div class="acoes"><button class="btn" data-a="fechar">Fechar</button></div></div>';
  if(veuAberto.tipo==="sair") return '<div class="janela" role="dialog"><p class="chamada">Encerrar a partida?</p><p class="nota">A partida fica salva até alguém começar outra.</p><div class="acoes"><button class="btn perigo" data-a="sair-sim">Voltar à configuração</button><button class="btn sec" data-a="fechar">Continuar jogando</button></div></div>';
  if(veuAberto.tipo==="fim"){
    const v=g.jogadores[g.vencedor];
    return '<div class="janela vitoria" role="dialog"><p class="rotulo">Fim da treta · rodada '+g.rodada+'</p><p class="chamada" style="color:'+cor(v.cor).h+'">'+esc(v.nome)+' venceu</p>'+
      '<p class="objetivo">'+esc(objTexto(g.vencedor))+'</p>'+
      (g.modo==="objetivos"?'<p class="rotulo">Os objetivos de cada um</p><ul class="diario" style="color:var(--texto)">'+g.jogadores.map((p,k)=>'<li><b style="color:'+cor(p.cor).h+'">'+esc(p.nome)+':</b> '+esc(objTexto(k))+'</li>').join("")+'</ul>':'')+
      '<div class="acoes"><button class="btn" data-a="nova">Nova partida</button><button class="btn sec" data-a="fechar">Ver o mapa final</button></div></div>';
  }
  return "";
}

function desenhar(){
  if(EH_FONE){desenharFone();return;}
  const app=$("#app");
  const foco=document.activeElement&&document.activeElement.id;
  if(g&&g.fase!=="config"&&cfg.tela==="jogo"){
    if(g.fase==="fim"&&!veuAberto&&!g.fimVisto){veuAberto={tipo:"fim"};g.fimVisto=true;}
    if(!app.classList.contains("jogo")||!svgPronto||!$("#mapa svg")){
      app.className="app jogo"; app.innerHTML=telaJogo(); montarMapa();
    }else{
      $("#painel").innerHTML=painelJogo();
      $("#batalha").innerHTML=batalhaHTML();
      const topo=$(".topo-lado"); if(topo) topo.innerHTML=topoJogo();
    }
    pintarMapa(); animDados=false;
  }else{
    app.className="app"; svgPronto=false; app.innerHTML=telaConfig();
  }
  const veu=$("#veu"); veu.hidden=!veuAberto; veu.innerHTML=veuHTML();
  const qr=$("#qr"); if(qr&&!qr.childNodes.length){ if(window.QRCode){try{new QRCode(qr,{text:urlFone(),width:150,height:150,correctLevel:QRCode.CorrectLevel.M});}catch(e){}} else qr.innerHTML='<span style="color:#111;font-weight:800">'+(g?g.sala:cfg.sala)+'</span>'; }
  if(foco){const el=document.getElementById(foco);if(el&&el.focus)el.focus();}
}

/* ---------------- publicação para os celulares ---------------- */
let pubTimer=null;
function publicar(){
  if(EH_FONE) return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(()=>{
    const sala=g?g.sala:cfg.sala; if(!sala) return;
    const dados={fase:g?g.fase:"config",modo:g?g.modo:cfg.modo,
      jogadores:(g?g.jogadores:cfg.jogadores).map((p,k)=>({nome:p.nome,cor:p.cor,vivo:g?p.vivo:true,
        terr:g?terrDe(k).length:0,ex:g?exDe(k):0,cartas:g?p.cartas.map(c=>({t:c.t?T[c.t].n:null,s:c.s})):[]})),
      objetivos:g&&g.modo==="objetivos"?g.jogadores.map((p,k)=>objTexto(k)):null,
      vez:g?g.vez:null,vencedor:g?g.vencedor:null,rodada:g?g.rodada:0,atualizado:Date.now()};
    rede.update("salas/war-"+sala,dados);
  },250);
}
function ligarSala(){
  if(desligar) desligar();
  const sala=g?g.sala:cfg.sala;
  desligar=rede.ouvir("salas/war-"+sala+"/vinculos",v=>{remoto.vinculos=v||{};if(g&&cfg.tela==="jogo")$("#painel")&&($("#painel").innerHTML=painelJogo());});
}

/* ---------------- ações ---------------- */
function agir(a,d){
  const k=d.k!=null?+d.k:null;
  switch(a){
    case "cor":{const usadas=cfg.jogadores.map(p=>p.cor);let i=CORES.findIndex(c=>c.id===cfg.jogadores[k].cor);
      for(let n=1;n<=CORES.length;n++){const c=CORES[(i+n)%CORES.length];if(usadas.indexOf(c.id)<0){cfg.jogadores[k].cor=c.id;break;}} break;}
    case "tirar": if(cfg.jogadores.length>3){cfg.jogadores.splice(k,1);cfg.exemplo=false;} break;
    case "mais": if(cfg.jogadores.length<6){const usadas=cfg.jogadores.map(p=>p.cor);const c=CORES.find(c=>usadas.indexOf(c.id)<0);cfg.jogadores.push({nome:"General "+(cfg.jogadores.length+1),cor:c.id});cfg.exemplo=false;} break;
    case "modo": cfg.modo=d.v; break;
    case "comecar": if(g&&g.sala) cfg.sala=g.sala; novaPartida(); cfg.tela="jogo"; ligarSala(); break;
    case "continuar": cfg.tela="jogo"; ligarSala(); break;
    case "nova": veuAberto=null; g.fase="config"; cfg.tela="config"; svgPronto=false; break;
    case "sair": veuAberto={tipo:"sair"}; break;
    case "sair-sim": veuAberto=null; cfg.tela="config"; svgPronto=false; break;
    case "fechar": veuAberto=null; break;
    case "ver-fim": veuAberto={tipo:"fim"}; break;
    case "ver-obj": veuAberto={tipo:"obj",i:+d.i,ver:false}; break;
    case "obj-mostra": if(veuAberto) veuAberto.ver=true; break;
    case "celulares": veuAberto={tipo:"celulares"}; break;
    case "avancar": avancar(); return;
    case "desfazer": if(g.colocados.length){const t=g.colocados.pop();g.ex[t]--;g.reforco++;} break;
    case "tudo-aqui": if(g.sel&&g.dono[g.sel]===g.vez){g.ex[g.sel]+=g.reforco;for(let n=0;n<g.reforco;n++)g.colocados.push(g.sel);g.reforco=0;} break;
    case "trocar": trocar(false); break;
    case "sel": case "alvo": case "mover": tocar(d.t); return;
    case "atacar": atacar(false); return;
    case "blitz": atacar(true); return;
    case "ocupar": ocupar(+d.n); return;
    case "mover-tudo": if(g.sel&&g.alvo){while(livre(g.sel)>0)moverUm(g.sel,g.alvo);} break;
    default: return;
  }
  if(g&&g.fase==="jogo") verificar();
  salvar(); desenhar();
}

document.addEventListener("click",e=>{
  if(EH_FONE){foneClique(e);return;}
  const b=e.target.closest("[data-a]");
  if(b&&!b.disabled){manterTela();agir(b.dataset.a,b.dataset);return;}
  const t=e.target.closest("#mapa [data-t]");
  if(t&&g&&cfg.tela==="jogo"){manterTela();tocar(t.dataset.t);}
});
document.addEventListener("input",e=>{
  if(EH_FONE) return;
  const el=e.target; if(el.dataset&&el.dataset.nome!=null){const p=cfg.jogadores[+el.dataset.nome];if(p){p.nome=el.value.trim();cfg.exemplo=false;guardar(CHAVE,{g,cfg});}}
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&veuAberto){veuAberto=null;desenhar();} });

let trava=null;
function manterTela(){ if(trava||!navigator.wakeLock) return; navigator.wakeLock.request("screen").then(w=>{trava=w;w.addEventListener("release",()=>{trava=null;});}).catch(()=>{}); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") manterTela(); });

/* =====================================================================
   CELULAR
   ===================================================================== */
const CHAVE_FONE="treta-fone-"+SALA_FONE;
let eu=abrir(CHAVE_FONE)||{dev:novoId(),i:null}, salaF=null;
guardar(CHAVE_FONE,eu);
function foneClique(e){
  const b=e.target.closest("[data-a]"); if(!b) return;
  if(b.dataset.a==="sou"){ eu.i=+b.dataset.i; guardar(CHAVE_FONE,eu); rede.set("salas/war-"+SALA_FONE+"/vinculos/"+eu.i,eu.dev); }
  if(b.dataset.a==="trocar-eu"){ if(eu.i!=null) rede.remove("salas/war-"+SALA_FONE+"/vinculos/"+eu.i); eu.i=null; guardar(CHAVE_FONE,eu); }
  if(b.dataset.a==="espiar"){ eu.ver=!eu.ver; }
  desenharFone();
}
function desenharFone(){
  const app=$("#app"); app.className="app fone";
  const s=salaF;
  let corpo;
  if(s===null) corpo='<p class="nota">Procurando a sala '+esc(SALA_FONE)+'…</p>';
  else if(!s.jogadores) corpo='<div class="cartao"><p class="chamada">Sala '+esc(SALA_FONE)+' não encontrada</p><p class="nota">Confira o código na TV ou leia o QR Code de novo.</p></div>';
  else if(eu.i==null||!s.jogadores[eu.i]){
    corpo='<div class="cartao"><p class="rotulo">Sala '+esc(SALA_FONE)+'</p><p class="chamada">Quem é você?</p><div class="escolher">'+
      s.jogadores.map((p,k)=>'<button data-a="sou" data-i="'+k+'"><span class="bolinha" style="background:'+cor(p.cor).h+'"></span>'+esc(p.nome)+'</button>').join("")+'</div></div>';
  }else{
    const p=s.jogadores[eu.i], obj=s.objetivos&&s.objetivos[eu.i];
    let objHTML;
    if(s.modo==="total") objHTML='<p class="objetivo">Conquistar todos os 34 territórios</p>';
    else if(s.fase!=="jogo"&&s.fase!=="fim") objHTML='<p class="nota">Seu objetivo aparece aqui quando a partida começar.</p>';
    else objHTML=eu.ver?'<p class="objetivo">'+esc(obj||"")+'</p><button class="btn sec" data-a="espiar">Esconder</button>':'<button class="btn" data-a="espiar">Ver meu objetivo</button>';
    corpo='<div class="cartao"><div class="vez"><span class="bolinha" style="background:'+cor(p.cor).h+'"></span><strong>'+esc(p.nome)+'</strong></div>'+
      (p.vivo?'<p class="nota">'+pl(p.terr,"território","territórios")+' · '+pl(p.ex,"exército","exércitos")+(s.vez===eu.i&&s.fase==="jogo"?' · <b style="color:var(--faixa)">sua vez</b>':'')+'</p>':'<p class="nota">Você foi eliminado. Ainda dá para torcer.</p>')+
      '<p class="rotulo">Objetivo secreto</p>'+objHTML+'</div>'+
      '<div class="cartao"><p class="rotulo">Suas cartas</p>'+(p.cartas&&p.cartas.length?'<div class="cartas">'+p.cartas.map(c=>'<span class="carta"><span class="simb">'+SIMB[c.s]+'</span>'+esc(c.t||"Coringa")+'</span>').join("")+'</div>':'<p class="nota">Nenhuma carta ainda.</p>')+'</div>'+
      (s.fase==="fim"&&s.vencedor!=null?'<div class="cartao"><p class="chamada">'+esc(s.jogadores[s.vencedor].nome)+' venceu</p></div>':'')+
      '<div class="acoes"><button class="btn sec mini" data-a="trocar-eu">Não sou '+esc(p.nome)+'</button></div>';
  }
  app.innerHTML='<header class="topo"><h1 class="marca">Treta <span>Metropolitana</span></h1><div class="topo-lado"><span class="chip sala">Sala '+esc(SALA_FONE)+'</span></div></header><main class="bloco">'+corpo+'</main>';
}

/* ---------------- início ---------------- */
if(EH_FONE){
  desenharFone();
  rede.ouvir("salas/war-"+SALA_FONE,v=>{salaF=v||{};desenharFone();});
}else{
  const salvo=abrir(CHAVE);
  cfg=(salvo&&salvo.cfg)||cfgNova(); g=(salvo&&salvo.g)||null;
  if(!cfg.sala) cfg.sala=novoCodigo();
  cfg.tela=g&&g.fase!=="config"?"jogo":"config";
  if(g&&g.fase==="fim") g.fimVisto=true;
  ligarSala(); desenhar(); publicar();
}
})();
</script>
</body>
</html>
